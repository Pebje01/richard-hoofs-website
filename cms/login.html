<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inloggen · Dokter Richard Beheer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f0ede8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 48px 40px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 4px 32px rgba(58,61,50,0.10);
    }

    .logo {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #4a6741;
      margin-bottom: 8px;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #2c3322;
      margin-bottom: 32px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #5a5a4a;
      margin-bottom: 8px;
    }

    input[type="password"] {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
      color: #2c3322;
    }

    input[type="password"]:focus { border-color: #4a6741; }

    .fout {
      background: #fdf0ee;
      border: 1px solid #f5c0b8;
      color: #c0392b;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      margin-bottom: 20px;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 13px;
      background: #4a6741;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover { background: #3a5532; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">Dokter Richard</div>
    <h1>Website beheer</h1>

    <form method="POST" action="/beheer/login">
      <label for="wachtwoord">Wachtwoord</label>

      <div id="foutmelding" class="fout" style="display:none">
        Wachtwoord klopt niet. Probeer opnieuw.
      </div>

      <input
        type="password"
        id="wachtwoord"
        name="password"
        placeholder="Voer je wachtwoord in"
        autofocus
        required
      >
      <button type="submit">Inloggen</button>
    </form>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    if (params.get('fout')) {
      document.getElementById('foutmelding').style.display = 'block';
    }
  </script>
</body>
</html>
